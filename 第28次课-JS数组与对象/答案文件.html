<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第28课答案：JS数组与对象</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }
        .answer-box { background: #e8f5e9; border-left: 5px solid #4caf50; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .answer-box h3 { margin: 0 0 10px 0; color: #2e7d32; font-size: 16px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; background: #2196f3; color: white; cursor: pointer; font-size: 14px; }
        button:hover { opacity: 0.9; }
        .list-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; min-height: 50px; border: 1px solid #eee; }
        .action-btn { width: 100%; padding: 15px; font-size: 18px; background: #ff9800; font-weight: bold; margin-top: 10px; }
        #winner { text-align: center; font-size: 24px; font-weight: bold; color: #e91e63; margin-top: 20px; min-height: 36px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 幸运抽奖系统 (答案)</h1>
        
        <div class="answer-box">
            <h3>✅ 参考答案</h3>
            <p style="margin:0; color:#555; font-size:14px;">使用了数组的 push 方法和 Math.random() 随机数生成。</p>
        </div>

        <div class="input-group">
            <input type="text" id="nameInput" placeholder="输入参与者姓名">
            <button id="addBtn">添加名单</button>
        </div>

        <div class="list-box">
            <strong>当前名单 (<span id="count">0</span>人):</strong>
            <div id="nameList" style="color: #666; margin-top: 5px;">(暂无人员)</div>
        </div>

        <button id="drawBtn" class="action-btn">🎲 开始抽奖</button>
        <div id="winner"></div>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const nameListDiv = document.getElementById('nameList');
        const countSpan = document.getElementById('count');
        const winnerDiv = document.getElementById('winner');

        // 1. 创建数组
        const names = [];

        // 2. 添加名字
        document.getElementById('addBtn').addEventListener('click', function() {
            const name = nameInput.value.trim();
            if (!name) return;

            // 添加到数组
            names.push(name);
            
            // 更新显示
            nameListDiv.innerText = names.join(', ');
            countSpan.innerText = names.length;
            nameInput.value = '';
        });

        // 3. 随机抽奖
        document.getElementById('drawBtn').addEventListener('click', function() {
            if (names.length === 0) {
                alert('名单为空，无法抽奖！');
                return;
            }

            // 生成随机索引
            const randomIndex = Math.floor(Math.random() * names.length);
            
            // 获取名字
            const luckyName = names[randomIndex];
            
            // 显示结果
            winnerDiv.innerText = '🎉 中奖者：' + luckyName;
            winnerDiv.style.animation = 'none';
            winnerDiv.offsetHeight; /* trigger reflow */
            winnerDiv.style.animation = 'pulse 0.5s';
        });
    </script>
    <style>
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</body>
</html>
