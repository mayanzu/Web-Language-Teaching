<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第30课练习：JS事件处理</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #222; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; width: 100%; max-width: 600px; }
        h1 { margin-bottom: 10px; }
        .todo-box { background: #333; border-left: 5px solid #2196f3; padding: 15px; margin-bottom: 30px; border-radius: 4px; text-align: left; }
        .todo-box h3 { margin: 0 0 10px 0; color: #64b5f6; font-size: 16px; }
        .todo-box ol { margin: 0; padding-left: 20px; color: #ccc; font-size: 14px; }
        
        #gameArea { 
            width: 300px; 
            height: 300px; 
            background: #444; 
            margin: 0 auto; 
            border-radius: 12px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.2s;
            user-select: none;
        }
        
        #scoreBoard { font-size: 24px; margin-bottom: 20px; }
        #message { color: #aaa; margin-top: 10px; min-height: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 反应测试游戏</h1>
        
        <div class="todo-box">
            <h3>📝 练习任务</h3>
            <ol>
                <li>给方块 (id="gameArea") 添加 <code>mouseover</code> 事件：鼠标移入时变色。</li>
                <li>给方块添加 <code>mouseout</code> 事件：鼠标移出时恢复颜色。</li>
                <li>给方块添加 <code>click</code> 事件：点击时分数 +1，并更新显示。</li>
            </ol>
        </div>

        <div id="scoreBoard">得分：<span id="score">0</span></div>
        
        <div id="gameArea">
            <span>点我!</span>
        </div>

        <div id="message">鼠标移入方块试试看...</div>
    </div>

    <script>
        const box = document.getElementById('gameArea');
        const scoreSpan = document.getElementById('score');
        const msg = document.getElementById('message');
        let score = 0;

        // 🎯 任务一：鼠标移入事件 (mouseover)
        box.addEventListener('mouseover', function() {
            // 1. 修改背景颜色 (例如 '#ff4081')
            // this.style.backgroundColor = ...
            
            
            // 2. 修改提示文字
            msg.innerText = '快点击！';
        });

        // 🎯 任务二：鼠标移出事件 (mouseout)
        box.addEventListener('mouseout', function() {
            // 1. 恢复背景颜色 ('#444')
            
            
            // 2. 恢复提示文字
            msg.innerText = '鼠标移入方块试试看...';
        });

        // 🎯 任务三：点击事件 (click)
        box.addEventListener('click', function() {
            // 1. 分数加 1
            // score++;
            
            // 2. 更新页面显示
            // scoreSpan.innerText = score;
            
            // 3. (可选) 随机改变方块大小或位置
        });
    </script>
</body>
</html>
