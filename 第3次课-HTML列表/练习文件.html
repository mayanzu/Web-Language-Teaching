<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>第3次课-HTML列表 - 练习</title>
    <style>
        /* 简约风格样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e1e4e8;
        }
        
        h2 {
            font-size: 20px;
            font-weight: 600;
            color: #34495e;
            margin: 24px 0 12px;
        }
        
        h3 {
            font-size: 18px;
            font-weight: 600;
            color: #34495e;
            margin: 20px 0 10px;
        }
        
        p {
            margin-bottom: 16px;
            font-size: 16px;
        }
        
        ul, ol {
            margin: 16px 0;
            padding-left: 24px;
        }
        
        li {
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .exercise-section {
            background-color: white;
            padding: 20px;
            margin: 16px 0;
            border-radius: 6px;
            border: 1px solid #e1e4e8;
        }
        
        .code {
            background-color: #f6f8fa;
            padding: 16px;
            margin: 16px 0;
            border-radius: 6px;
            font-family: 'Cascadia Code', 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            overflow-x: auto;
            white-space: pre-wrap;
            border: 1px solid #e1e4e8;
        }
    </style>
</head>
<body>
    <h1>第3次课-HTML列表 - 练习</h1>
    
    <div class='exercise-section'>
        <h2>练习目的</h2>
        <p>通过本次练习，您将掌握以下知识点：</p>
        <ul>
            <li>本课学习的主要HTML/CSS/JS概念</li>
            <li>相关标签、属性和值的使用</li>
            <li>代码结构和组织方式</li>
            <li>调试和验证方法</li>
        </ul>
    </div>
    
    <div class='exercise-section'>
        <h2>练习内容</h2>
        <ol>
            <li>请根据本课内容创建相关HTML/CSS/JS文件</li>
            <li>练习本课学习的主要知识点</li>
            <li>尝试不同的属性和值组合</li>
            <li>验证代码的正确性</li>
            <li>优化代码结构和可读性</li>
        </ol>
    </div>
    
    <div class='exercise-section'>
        <h2>注意事项</h2>
        <ul>
            <li>请确保代码符合语义化标准</li>
            <li>注意代码缩进和格式</li>
            <li>添加必要的注释</li>
            <li>测试在不同浏览器中的兼容性</li>
        </ul>
    </div>
</body>
</html>
