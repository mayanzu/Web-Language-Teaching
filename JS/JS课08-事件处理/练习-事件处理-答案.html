<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第8课：事件处理 - 练习答案</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 40px;
            line-height: 1.6;
            transition: background-color 0.3s;
        }
        h1 {
            color: #0066cc;
            margin-bottom: 10px;
        }
        h2 {
            color: #0066cc;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 20px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0055aa;
        }
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #0066cc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .answer-note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .info {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="answer-note">
        <strong>📝 答案说明：</strong>这是练习题的参考答案。本练习考察 addEventListener 监听事件、click 点击事件、input 输入事件，结合 DOM 操作实现交互。
    </div>

    <h1>⚡ 互动页面练习</h1>
    
    <!-- 任务1：切换背景色 -->
    <h2>任务1：切换背景色</h2>
    <button id="colorBtn">切换背景色</button>
    
    <!-- 任务2：字符计数器 -->
    <h2>任务2：字符计数器</h2>
    <textarea id="textInput" rows="4" placeholder="在这里输入文字..."></textarea>
    <p id="charCount" class="info">字符数：0</p>
    
    <!-- 任务3：点击计数器 -->
    <h2>任务3：点击计数器</h2>
    <button id="countBtn">点击我</button>
    <p id="clickCount" class="info">点击次数：0</p>

    <script>
        // ========== 任务1：切换背景色 ==========
        
        const colorBtn = document.getElementById('colorBtn');
        
        // 监听点击事件
        colorBtn.addEventListener('click', function() {
            // 获取当前背景色
            const currentColor = document.body.style.backgroundColor;
            
            // 在两种颜色之间切换
            if (currentColor === 'lightblue' || currentColor === '') {
                document.body.style.backgroundColor = 'lightgreen';
            } else {
                document.body.style.backgroundColor = 'lightblue';
            }
        });
        
        // ========== 任务2：字符计数器 ==========
        
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        
        // 监听 input 事件（每次输入都会触发）
        textInput.addEventListener('input', function() {
            // 获取输入框的值
            const text = textInput.value;
            
            // 获取字符数
            const count = text.length;
            
            // 更新显示
            charCount.innerText = `字符数：${count}`;
            
            // 进阶：字符数超过 50 时显示红色
            if (count > 50) {
                charCount.style.color = 'red';
            } else {
                charCount.style.color = 'black';
            }
        });
        
        // ========== 任务3：点击计数器 ==========
        
        const countBtn = document.getElementById('countBtn');
        const clickCountDisplay = document.getElementById('clickCount');
        
        // 创建变量存储点击次数
        let count = 0;
        
        // 监听点击事件
        countBtn.addEventListener('click', function() {
            // 点击次数加 1
            count++;
            
            // 更新显示
            clickCountDisplay.innerText = `点击次数：${count}`;
        });
        
        // ========== 进阶示例：其他事件类型 ==========
        
        // mouseover 事件（鼠标悬停）
        // countBtn.addEventListener('mouseover', function() {
        //     countBtn.style.transform = 'scale(1.1)';
        // });
        
        // mouseout 事件（鼠标离开）
        // countBtn.addEventListener('mouseout', function() {
        //     countBtn.style.transform = 'scale(1)';
        // });
        
        // dblclick 事件（双击）
        // countBtn.addEventListener('dblclick', function() {
        //     count = 0;
        //     clickCountDisplay.innerText = `点击次数：${count}`;
        // });
    </script>
</body>
</html>
