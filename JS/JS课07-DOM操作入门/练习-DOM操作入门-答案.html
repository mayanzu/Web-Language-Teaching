<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第7课：DOM操作入门 - 练习答案</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #0066cc;
            margin-bottom: 20px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0055aa;
        }
        #card {
            padding: 20px;
            border: 2px solid #0066cc;
            border-radius: 8px;
            background-color: white;
            margin: 20px 0;
        }
        #card h2 {
            margin-bottom: 10px;
        }
        #card p {
            margin-bottom: 8px;
        }
        .answer-note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="answer-note">
        <strong>📝 答案说明：</strong>这是练习题的参考答案。本练习考察 getElementById/querySelector 选择元素、innerText 修改内容、style 修改样式。
    </div>

    <h1>🎨 个人名片编辑器</h1>
    
    <div id="card">
        <h2 id="name">张三</h2>
        <p id="job">Web开发工程师</p>
        <p id="bio">热爱编程，喜欢学习新技术。</p>
    </div>
    
    <div>
        <button id="changeNameBtn">修改姓名</button>
        <button id="changeColorBtn">改变颜色</button>
        <button id="changeSizeBtn">放大字体</button>
    </div>

    <script>
        // ========== 选择元素 ==========
        
        // 使用 getElementById 选择名片中的元素
        const nameElement = document.getElementById('name');
        const jobElement = document.getElementById('job');
        const bioElement = document.getElementById('bio');
        const cardElement = document.getElementById('card');
        
        // 选择按钮
        const changeNameBtn = document.getElementById('changeNameBtn');
        const changeColorBtn = document.getElementById('changeColorBtn');
        const changeSizeBtn = document.getElementById('changeSizeBtn');
        
        // ========== 修改文本内容 ==========
        
        changeNameBtn.addEventListener('click', function() {
            // 使用 innerText 修改姓名
            nameElement.innerText = "李四";
            
            // 也可以修改其他内容
            jobElement.innerText = "前端开发工程师";
            bioElement.innerText = "擅长 HTML、CSS 和 JavaScript。";
            
            // 也可以使用 textContent（效果类似）
            // nameElement.textContent = "李四";
        });
        
        // ========== 修改样式 ==========
        
        changeColorBtn.addEventListener('click', function() {
            // 修改文字颜色
            nameElement.style.color = "red";
            jobElement.style.color = "blue";
            bioElement.style.color = "green";
            
            // 修改背景色（注意 CSS 的 background-color 在 JS 中是驼峰式）
            cardElement.style.backgroundColor = "#fffacd";
        });
        
        changeSizeBtn.addEventListener('click', function() {
            // 修改字体大小（注意要带单位）
            nameElement.style.fontSize = "32px";
            jobElement.style.fontSize = "18px";
            bioElement.style.fontSize = "16px";
        });
        
        // ========== 进阶示例：使用 querySelector ==========
        
        // 也可以使用 querySelector 选择元素
        // const name = document.querySelector('#name');  // 选择 id（需要加 #）
        // const job = document.querySelector('#job');
        
        // 选择所有 p 标签（返回第一个匹配的）
        // const firstP = document.querySelector('p');
        
        // 选择所有 p 标签（返回所有匹配的）
        // const allPs = document.querySelectorAll('p');
        // allPs.forEach(function(p) {
        //     p.style.color = 'purple';
        // });
    </script>
</body>
</html>
