<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第5课：函数 - 练习答案</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #0066cc;
            margin-bottom: 20px;
        }
        h2 {
            color: #0066cc;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 20px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0055aa;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            font-size: 18px;
            min-height: 80px;
            border: 2px solid #0066cc;
        }
        .answer-note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="answer-note">
        <strong>📝 答案说明：</strong>这是练习题的参考答案。本练习考察函数声明、参数传递、返回值的使用。
    </div>

    <h1>📦 函数练习</h1>
    
    <h2>任务1：加法函数</h2>
    <button id="addBtn">测试加法 (10 + 20)</button>
    
    <h2>任务2：问候函数</h2>
    <button id="greetBtn">测试问候 ("小明")</button>
    
    <h2>任务3：判断成年函数</h2>
    <button id="adultBtn">测试判断成年 (16岁)</button>
    
    <div id="result">点击按钮测试函数</div>

    <script>
        // ========== 函数定义部分 ==========
        
        // 1. 加法函数 - 接收两个参数，返回它们的和
        function add(a, b) {
            const sum = a + b;
            return sum;
        }
        
        // 2. 问候函数 - 接收名字参数，返回问候语
        function greet(name) {
            return `你好，${name}！欢迎学习 JavaScript。`;
        }
        
        // 3. 判断成年函数 - 接收年龄参数，返回布尔值
        function isAdult(age) {
            if (age >= 18) {
                return true;
            } else {
                return false;
            }
            // 更简洁的写法：
            // return age >= 18;
        }
        
        // ========== 调用函数部分 ==========
        
        const resultDiv = document.getElementById('result');
        
        // 测试加法函数
        document.getElementById('addBtn').addEventListener('click', function() {
            // 调用 add 函数，传入 10 和 20
            const result = add(10, 20);
            resultDiv.textContent = `10 + 20 = ${result}`;
        });
        
        // 测试问候函数
        document.getElementById('greetBtn').addEventListener('click', function() {
            // 调用 greet 函数，传入 "小明"
            const message = greet("小明");
            resultDiv.textContent = message;
        });
        
        // 测试判断成年函数
        document.getElementById('adultBtn').addEventListener('click', function() {
            // 调用 isAdult 函数，传入 16
            const check = isAdult(16);
            resultDiv.textContent = `16岁是否成年：${check}`;
            
            // 也可以测试其他年龄
            // const check18 = isAdult(18);
            // resultDiv.textContent += `\n18岁是否成年：${check18}`;
        });
        
        // ========== 进阶示例：其他函数 ==========
        
        // 乘法函数
        function multiply(a, b) {
            return a * b;
        }
        
        // 获取两数中的较大值
        function getMax(a, b) {
            if (a > b) {
                return a;
            } else {
                return b;
            }
            // 更简洁的写法：
            // return a > b ? a : b;
        }
    </script>
</body>
</html>
