<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第6课：数组和对象 - 练习答案</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #0066cc;
            margin-bottom: 20px;
        }
        .input-group {
            margin: 20px 0;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #0066cc;
            border-radius: 5px;
            margin-right: 10px;
            width: 200px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0055aa;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            font-size: 16px;
            min-height: 100px;
            border: 2px solid #0066cc;
            white-space: pre-line;
        }
        .answer-note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="answer-note">
        <strong>📝 答案说明：</strong>这是练习题的参考答案。本练习考察数组的创建、访问、push/pop/shift/unshift 方法、遍历，以及对象的基本使用。
    </div>

    <h1>📚 购物清单管理器</h1>
    
    <div class="input-group">
        <input type="text" id="itemInput" placeholder="输入商品名称">
    </div>
    
    <div>
        <button id="pushBtn">添加到末尾 (push)</button>
        <button id="popBtn">删除最后一个 (pop)</button>
        <button id="shiftBtn">删除第一个 (shift)</button>
        <button id="unshiftBtn">添加到开头 (unshift)</button>
        <button id="showBtn">显示全部</button>
    </div>
    
    <div id="result">购物清单为空</div>

    <script>
        // 创建空数组存储购物清单
        const shoppingList = [];
        
        // 获取页面元素
        const itemInput = document.getElementById('itemInput');
        const resultDiv = document.getElementById('result');
        
        // 1. 添加到末尾 - push()
        document.getElementById('pushBtn').addEventListener('click', function() {
            const item = itemInput.value;
            if (item) {
                shoppingList.push(item);  // 在数组末尾添加元素
                itemInput.value = '';  // 清空输入框
                resultDiv.textContent = `已添加：${item}\n当前清单：${shoppingList}`;
            } else {
                resultDiv.textContent = '请先输入商品名称！';
            }
        });
        
        // 2. 删除最后一个 - pop()
        document.getElementById('popBtn').addEventListener('click', function() {
            if (shoppingList.length > 0) {
                const removed = shoppingList.pop();  // 删除并返回最后一个元素
                resultDiv.textContent = `已删除：${removed}\n剩余清单：${shoppingList}`;
            } else {
                resultDiv.textContent = '清单已空，无法删除！';
            }
        });
        
        // 3. 删除第一个 - shift()
        document.getElementById('shiftBtn').addEventListener('click', function() {
            if (shoppingList.length > 0) {
                const removed = shoppingList.shift();  // 删除并返回第一个元素
                resultDiv.textContent = `已删除：${removed}\n剩余清单：${shoppingList}`;
            } else {
                resultDiv.textContent = '清单已空，无法删除！';
            }
        });
        
        // 4. 添加到开头 - unshift()
        document.getElementById('unshiftBtn').addEventListener('click', function() {
            const item = itemInput.value;
            if (item) {
                shoppingList.unshift(item);  // 在数组开头添加元素
                itemInput.value = '';
                resultDiv.textContent = `已添加到开头：${item}\n当前清单：${shoppingList}`;
            } else {
                resultDiv.textContent = '请先输入商品名称！';
            }
        });
        
        // 5. 显示全部 - 使用 forEach 遍历
        document.getElementById('showBtn').addEventListener('click', function() {
            if (shoppingList.length === 0) {
                resultDiv.textContent = '购物清单为空！';
                return;
            }
            
            let display = '📋 购物清单：\n';
            // 使用 forEach 遍历数组
            shoppingList.forEach(function(item, index) {
                display += `${index + 1}. ${item}\n`;
            });
            display += `\n总共 ${shoppingList.length} 件商品`;
            
            resultDiv.textContent = display;
        });
        
        // ========== 进阶示例：使用对象 ==========
        
        // 创建商品对象
        const product = {
            name: "苹果",
            price: 5.5,
            quantity: 10
        };
        
        // 访问对象属性
        console.log('商品名称：', product.name);
        console.log('商品价格：', product.price);
        console.log('商品数量：', product.quantity);
        
        // 修改对象属性
        product.quantity = 20;
        console.log('修改后的数量：', product.quantity);
    </script>
</body>
</html>
