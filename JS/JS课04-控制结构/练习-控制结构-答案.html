<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第4课：控制结构 - 练习答案</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #0066cc;
            margin-bottom: 20px;
        }
        .input-group {
            margin: 20px 0;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #0066cc;
            border-radius: 5px;
            margin-right: 10px;
            width: 200px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0055aa;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            font-size: 24px;
            font-weight: bold;
            min-height: 80px;
            border: 2px solid #0066cc;
            text-align: center;
            line-height: 40px;
            font-family: 'Cascadia Code', 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
        }
        .answer-note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .grade-excellent { color: #28a745; }
        .grade-good { color: #17a2b8; }
        .grade-medium { color: #ffc107; }
        .grade-pass { color: #fd7e14; }
        .grade-fail { color: #dc3545; }
    </style>
</head>
<body>
    <div class="answer-note">
        <strong>📝 答案说明：</strong>这是练习题的参考答案。本练习考察 if...else if...else 多分支条件判断的使用。
    </div>

    <h1>📊 成绩等级判定器</h1>
    
    <div class="input-group">
        <label>请输入分数（0-100）：</label>
        <input type="number" id="scoreInput" placeholder="请输入分数" min="0" max="100">
        <button id="checkBtn">查询等级</button>
    </div>
    
    <div id="result">请输入分数并点击查询</div>

    <script>
        // 获取页面元素
        const scoreInput = document.getElementById('scoreInput');
        const checkBtn = document.getElementById('checkBtn');
        const resultDiv = document.getElementById('result');
        
        // 点击按钮时判定等级
        checkBtn.addEventListener('click', function() {
            // 获取输入的分数
            const score = Number(scoreInput.value);
            let grade;
            let gradeClass;
            
            // 多分支条件判断（讲义第1节）
            if (score >= 90 && score <= 100) {
                grade = "优秀";
                gradeClass = "grade-excellent";
            } else if (score >= 80 && score < 90) {
                grade = "良好";
                gradeClass = "grade-good";
            } else if (score >= 70 && score < 80) {
                grade = "中等";
                gradeClass = "grade-medium";
            } else if (score >= 60 && score < 70) {
                grade = "及格";
                gradeClass = "grade-pass";
            } else if (score >= 0 && score < 60) {
                grade = "不及格";
                gradeClass = "grade-fail";
            } else {
                grade = "输入无效，请输入0-100的分数";
                gradeClass = "";
            }
            
            // 显示结果
            resultDiv.textContent = `成绩等级：${grade}`;
            
            // 设置颜色（进阶功能）
            resultDiv.className = gradeClass;
        });
    </script>
</body>
</html>
