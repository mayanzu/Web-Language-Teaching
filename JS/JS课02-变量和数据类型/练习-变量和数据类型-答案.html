<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第2课：变量和数据类型 - 练习答案</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #0066cc;
            margin-bottom: 20px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0055aa;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            font-size: 18px;
            line-height: 1.8;
            min-height: 100px;
            border: 2px solid #0066cc;
        }
        .answer-note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="answer-note">
        <strong>📝 答案说明：</strong>这是练习题的参考答案。本练习考察 const 声明、三种基本数据类型（字符串、数字、布尔值）和模板字符串的使用。
    </div>

    <h1>📚 学生信息展示器</h1>
    <button id="showBtn">显示学生信息</button>
    <div id="result"></div>

    <script>
        // 使用 const 声明字符串类型（讲义第4.1节）
        const studentName = "李华";
        
        // 使用 const 声明数字类型（讲义第4.2节）
        const studentAge = 16;
        
        // 使用 const 声明布尔类型（讲义第4.3节）
        const isLeagueMember = true;  // true 表示是团员
        
        // 获取页面元素
        const showBtn = document.getElementById('showBtn');
        const resultDiv = document.getElementById('result');
        
        // 点击按钮时显示信息
        showBtn.addEventListener('click', function() {
            // 使用模板字符串（讲义第4.1节）
            // 注意：使用反引号 ` 和 ${变量名}
            let message = `姓名：${studentName}
年龄：${studentAge} 岁
是否团员：${isLeagueMember}`;
            
            // 将信息显示到页面上
            resultDiv.textContent = message;
        });
        
        // 进阶练习示例（可选）
        // 可以添加更多变量：
        // const studentGrade = "高一";
        // const studentScore = 95;
        // 然后在模板字符串中加入：
        // 年级：${studentGrade}
        // 分数：${studentScore}
    </script>
</body>
</html>
