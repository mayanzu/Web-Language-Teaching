<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第25课答案：JS运算符与表达式</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 480px; 
        }
        h1 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 25px;
            font-size: 24px;
        }
        .answer-box { 
            background: #e8f5e9; 
            border-left: 5px solid #4caf50; 
            padding: 15px; 
            margin-bottom: 25px; 
            border-radius: 4px; 
        }
        .answer-box h3 { 
            margin-top: 0; 
            color: #2e7d32; 
            font-size: 18px;
            margin-bottom: 10px;
        }
        .input-group { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 16px; 
            text-align: center;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #2196f3;
        }
        .btn-group { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            margin-bottom: 25px; 
        }
        button { 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            background: #4caf50; 
            color: white; 
            font-size: 24px; 
            cursor: pointer; 
            transition: transform 0.1s, opacity 0.2s; 
            font-family: monospace;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.95); }
        
        button.sub { background: #f44336; } 
        button.mul { background: #ff9800; } 
        button.div { background: #2196f3; } 
        
        #result { 
            padding: 20px; 
            background: #f8f9fa; 
            border: 2px dashed #dee2e6; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            color: #333; 
            min-height: 70px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 简易计算器 (参考答案)</h1>
        
        <div class="answer-box">
            <h3>✅ 参考答案说明</h3>
            <p style="color: #555;">本页面包含了完整的 JavaScript 实现代码。你可以右键点击页面选择"查看网页源代码"来学习具体的实现逻辑。</p>
        </div>

        <!-- 计算器界面 -->
        <div class="input-group">
            <input type="number" id="num1" placeholder="输入数字 1" value="10">
            <input type="number" id="num2" placeholder="输入数字 2" value="5">
        </div>

        <div class="btn-group">
            <button id="addBtn" title="加法">+</button>
            <button id="subBtn" class="sub" title="减法">-</button>
            <button id="mulBtn" class="mul" title="乘法">×</button>
            <button id="divBtn" class="div" title="除法">÷</button>
        </div>

        <div id="result">请点击上方按钮进行计算</div>
    </div>

    <script>
        // 1. 获取页面元素
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const resultDiv = document.getElementById('result');
        
        const addBtn = document.getElementById('addBtn');
        const subBtn = document.getElementById('subBtn');
        const mulBtn = document.getElementById('mulBtn');
        const divBtn = document.getElementById('divBtn');

        // 2. 实现加法功能
        addBtn.addEventListener('click', function() {
            const n1 = Number(num1Input.value);
            const n2 = Number(num2Input.value);
            const sum = n1 + n2;
            resultDiv.innerText = `${n1} + ${n2} = ${sum}`;
            resultDiv.style.color = '#4caf50'; // 绿色
        });

        // 3. 实现减法功能
        subBtn.addEventListener('click', function() {
            const n1 = Number(num1Input.value);
            const n2 = Number(num2Input.value);
            const diff = n1 - n2;
            resultDiv.innerText = `${n1} - ${n2} = ${diff}`;
            resultDiv.style.color = '#f44336'; // 红色
        });

        // 4. 实现乘法功能
        mulBtn.addEventListener('click', function() {
            const n1 = Number(num1Input.value);
            const n2 = Number(num2Input.value);
            const prod = n1 * n2;
            resultDiv.innerText = `${n1} × ${n2} = ${prod}`;
            resultDiv.style.color = '#ff9800'; // 橙色
        });

        // 5. 实现除法功能
        divBtn.addEventListener('click', function() {
            const n1 = Number(num1Input.value);
            const n2 = Number(num2Input.value);
            
            // 简单的除零检查
            if (n2 === 0) {
                resultDiv.innerText = '错误：除数不能为 0';
                resultDiv.style.color = 'red';
            } else {
                const quot = n1 / n2;
                // 如果是无限循环小数，保留2位小数
                const displayQuot = Number.isInteger(quot) ? quot : quot.toFixed(2);
                resultDiv.innerText = `${n1} ÷ ${n2} = ${displayQuot}`;
                resultDiv.style.color = '#2196f3'; // 蓝色
            }
        });
    </script>
</body>
</html>
