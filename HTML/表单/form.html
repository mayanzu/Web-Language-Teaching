<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="https://www.baidu.com/s" target="_blank">
        <input type="text" name="wd" placeholder="在百度中搜索">
        <button>百度搜索</button>
    </form>

    <form action="https://search.jd.com/Search" target="_blank">
        <input type="text" name="keyword" placeholder="在京东中搜索">
        <button>京东搜索</button>
    </form>

    <form action="https://www.so.com/s" target="_blank">
        <input type="text" name="q">
        <button>360搜索</button>
    </form>

    <h1>自我介绍</h1>
    <p>请填写内容</p>

    <form action="https://search.jd.com/Search" target="_blank">
        姓名：
        <input type="text" name="xingming">
        <br>
        班级：
        <input type="text" name="banji">
        <br>
        年级：
        <select name="nianji">
            <option value="高一">高一</option>
            <option value="高二" selected>高二</option>
            <option value="高三">高三</option>
        </select>

        <br>
        我最喜欢的学科：
        <input type="radio" name="xueke" value="语文">语文
        <input type="radio" name="xueke" value="数学" checked>数学
        <input type="radio" name="xueke" value="英语">英语
        <br>

        爱好（可多选）：
        <input type="checkbox" name="aihao" value="篮球">篮球 
        <input type="checkbox" name="aihao" value="足球" checked>足球 
        <input type="checkbox" name="aihao" value="羽毛球">羽毛球
        <br> 

        自我介绍：
        <br>
        <textarea name="jieshao" rows="4" cols="40"></textarea>
        <br>

        <input type="submit" value="提交并保存">
        <input type="reset" value="重置表单">
        

    </form>
</body>
</html>
