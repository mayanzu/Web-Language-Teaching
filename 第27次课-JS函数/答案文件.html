<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第27课答案：迷你计算器(函数版)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }
        .answer-box { background: #e8f5e9; border-left: 5px solid #4caf50; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .answer-box h3 { margin: 0 0 10px 0; color: #2e7d32; font-size: 16px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; text-align: center; font-size: 16px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; background: #673ab7; color: white; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 2px dashed #dee2e6; border-radius: 8px; text-align: center; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 迷你计算器 (答案)</h1>
        
        <div class="answer-box">
            <h3>✅ 参考答案</h3>
            <p style="margin:0; color:#555; font-size:14px;">展示了函数的定义、参数传递和返回值的使用。</p>
        </div>

        <div class="input-group">
            <input type="number" id="num1" placeholder="数字 A" value="10">
            <input type="number" id="num2" placeholder="数字 B" value="5">
        </div>
        
        <div class="btn-group">
            <button id="addBtn">调用 add() 函数</button>
            <button id="subBtn" style="background: #e91e63;">调用 subtract() 函数</button>
        </div>

        <div id="result">结果显示区</div>
    </div>

    <script>
        const n1Input = document.getElementById('num1');
        const n2Input = document.getElementById('num2');
        const resultDiv = document.getElementById('result');

        // 定义 add 函数
        function add(a, b) {
            return a + b;
        }

        // 定义 subtract 函数
        function subtract(a, b) {
            return a - b;
        }

        // 调用 add
        document.getElementById('addBtn').addEventListener('click', function() {
            const x = Number(n1Input.value);
            const y = Number(n2Input.value);
            
            const res = add(x, y); // 获取返回值
            
            resultDiv.innerText = `add(${x}, ${y}) 的结果是：${res}`;
            resultDiv.style.color = '#673ab7';
        });

        // 调用 subtract
        document.getElementById('subBtn').addEventListener('click', function() {
            const x = Number(n1Input.value);
            const y = Number(n2Input.value);
            
            const res = subtract(x, y); // 获取返回值
            
            resultDiv.innerText = `subtract(${x}, ${y}) 的结果是：${res}`;
            resultDiv.style.color = '#e91e63';
        });
    </script>
</body>
</html>
