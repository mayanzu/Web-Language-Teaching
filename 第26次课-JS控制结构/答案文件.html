<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第26课答案：数字分析器</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }
        .answer-box { background: #e8f5e9; border-left: 5px solid #4caf50; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .answer-box h3 { margin: 0 0 10px 0; color: #2e7d32; font-size: 16px; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; text-align: center; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #4caf50; color: white; font-size: 16px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #2196f3; }
        #result { padding: 15px; background: #f8f9fa; border: 2px dashed #dee2e6; border-radius: 8px; text-align: center; color: #333; min-height: 40px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 数字分析器 (答案)</h1>
        
        <div class="answer-box">
            <h3>✅ 参考答案</h3>
            <p style="margin:0; color:#555; font-size:14px;">包含 if/else 判断和 for 循环累加的完整实现。</p>
        </div>

        <input type="number" id="numInput" placeholder="请输入一个正整数" value="10">
        
        <button id="checkBtn">判断奇偶 (if/else)</button>
        <button id="sumBtn" class="secondary">计算 1 到 N 的累加和 (for循环)</button>

        <div id="result">结果将显示在这里</div>
    </div>

    <script>
        const input = document.getElementById('numInput');
        const result = document.getElementById('result');
        const checkBtn = document.getElementById('checkBtn');
        const sumBtn = document.getElementById('sumBtn');

        // 任务一：判断奇偶
        checkBtn.addEventListener('click', function() {
            const n = Number(input.value);
            
            if (n % 2 === 0) {
                result.innerText = `${n} 是偶数`;
                result.style.color = '#2196f3';
            } else {
                result.innerText = `${n} 是奇数`;
                result.style.color = '#ff9800';
            }
        });

        // 任务二：计算累加和
        sumBtn.addEventListener('click', function() {
            const n = Number(input.value);
            
            if (n <= 0) {
                result.innerText = '请输入大于 0 的数字';
                return;
            }

            let sum = 0;
            for (let i = 1; i <= n; i++) {
                sum += i; // 等价于 sum = sum + i
            }
            
            result.innerText = `1 到 ${n} 的累加和是：${sum}`;
            result.style.color = '#4caf50';
        });
    </script>
</body>
</html>
